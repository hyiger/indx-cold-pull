# Publishes each GitHub release to the OrcaSlicer plugin's Orca Cloud listing.
# From https://cloud.orcaslicer.com/wiki/ (Publish from GitHub). The repository must be
# connected to the listing first: Edit plugin > GitHub publishing.
name: Publish to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  # Space-separated globs matching the plugin files to upload (.whl / .py).
  PLUGIN_FILES: "orca-plugin/dist/indx_cold_pull_any.py"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py inlines the core and the page into one file. Orca Cloud wants a target OS
      # suffix on the name, so the upload is a copy named _any.py.
      - name: Build the plugin
        run: |
          set -euo pipefail
          python orca-plugin/build.py
          cp orca-plugin/dist/indx_cold_pull.py orca-plugin/dist/indx_cold_pull_any.py

      # The tag becomes the version on Orca Cloud, so it must be the one the plugin's header gives.
      - name: Check the tag against the plugin's version
        run: |
          set -euo pipefail
          header="$(sed -nE 's/^# version = "([^"]+)"$/\1/p' $PLUGIN_FILES)"
          if [ "$header" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match version \"$header\" in $PLUGIN_FILES." >&2
            exit 1
          fi

      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          # At most 4000 bytes of the release notes, cut in one process at a character boundary. Piping jq into
          # head -c would end jq with SIGPIPE on long notes, which pipefail turns into a failed step.
          changelog="$(python3 -c 'import json, os; body = json.load(open(os.environ["GITHUB_EVENT_PATH"]))["release"].get("body") or ""; print(body.encode()[:4000].decode("utf-8", "ignore"), end="")')"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          # --form-string sends the JSON as it is: -F would read a ";" in it as the start of a field option.
          args=(--form-string "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
